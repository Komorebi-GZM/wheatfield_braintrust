[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maitian-agent"
version = "1.0.0"
description = "麦田智囊 - 乡村教育Agent系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "python-multipart>=0.0.20",
    "httpx>=0.25.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.37",
    "openai>=1.0.0",
    "langchain>=0.2.0,<1.0",
    "langchain-core>=0.2.0,<1.0",
    "langchain-openai>=0.1.0,<1.0",
    "langchain-community>=0.2.0,<1.0",
    "langchain-chroma>=0.1.0,<1.0",
    "chromadb>=0.4.0",
    "pillow>=13.0.0",
]

[project.scripts]
maitian-agent = "maitian_agent.cli:cli"

[project.optional-dependencies]
ocr-easyocr = ["easyocr>=1.7.0"]
rag = ["sentence-transformers>=2.2.0"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "httpx>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["maitian_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100
# P1-2/P1-5：排除非 Python 文件，避免被当作 Python 解析
force-exclude = true
extend-exclude = ["*.yml", "*.yaml", "*.example", ".env", ".env.*", "*.md"]

[tool.ruff.lint]
# 合理的规则集：pycodestyle 错误、pyflakes、import 排序、bugbear、pyupgrade
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# --- P1-2 正在其他工作树并行修改的文件：本工作树不改动它们，仅按文件忽略 ---
"maitian_agent/config/settings.py" = ["E501", "F401", "I001", "UP006", "UP035", "UP045", "UP011", "B904", "F841"]
"maitian_agent/llm.py" = ["E501", "F401", "I001", "UP006", "UP035", "UP045", "UP011", "B904", "F841"]
"maitian_agent/agents/*.py" = ["E501", "F401", "I001", "UP006", "UP035", "UP045", "B904", "F841"]
"maitian_agent/rag/embeddings.py" = ["E501", "I001", "UP006", "UP035", "UP045"]
"demo/agents/*.py" = ["E501", "F401", "I001", "UP006", "UP035", "UP045", "B904", "F841"]
# --- 遗留非 P1-2 文件中的少量非机械性告警：保持行为不变，逐文件忽略 ---
# Streamlit 演示：控件赋值有副作用（不可安全删除），且含较长中文文案
"demo/app.py" = ["E501", "F841"]
# 既有可变默认参数，改为 None 会带来行为差异
"maitian_agent/tools/ocr.py" = ["B006"]
# str,Enum 语义 / 未使用的循环变量与局部变量，非机械安全修复
"maitian_agent/rag/knowledge_base.py" = ["B007", "UP042", "F841"]
# 既有 except 中 raise 的异常链式风格，保持现状
"maitian_agent/api/routes.py" = ["B904"]
"maitian_agent/tools/asr.py" = ["B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: 需要真实模型/API Key 的集成测试；默认用 -m 'not live' 跳过",
]
addopts = "-m 'not live'"
