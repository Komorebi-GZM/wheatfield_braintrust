[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maitian-agent"
version = "1.0.0"
description = "麦田智囊 - 乡村教育Agent系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "python-multipart>=0.0.20",
    "httpx>=0.25.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.37",
    "openai>=1.0.0",
    "langchain>=1.0.0,<2.0.0",
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "langchain-chroma>=1.0.0,<2.0.0",
    "chromadb>=0.4.0",
    "pillow>=13.0.0",
]

[project.scripts]
maitian-agent = "maitian_agent.cli:cli"

[project.optional-dependencies]
ocr-easyocr = ["easyocr>=1.7.0"]
rag = ["langchain-huggingface>=1.0.0,<2.0.0", "sentence-transformers>=5.2.0"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "httpx>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["maitian_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100
# P1-2/P1-5：排除非 Python 文件，避免被当作 Python 解析
force-exclude = true
extend-exclude = ["*.yml", "*.yaml", "*.example", ".env", ".env.*", "*.md"]

[tool.ruff.lint]
# 合理的规则集：pycodestyle 错误、pyflakes、import 排序、bugbear、pyupgrade
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Streamlit 演示含较长中文文案，硬折行会损伤可读性
"demo/app.py" = ["E501"]
# 既有可变默认参数，改为 None 会带来行为差异
"maitian_agent/tools/ocr.py" = ["B006"]
# str+Enum 的 KnowledgeLevel 有序列化语义，不改为 StrEnum
"maitian_agent/rag/knowledge_base.py" = ["UP042"]
# 既有 except 中 raise 的异常链式风格，保持现状
"maitian_agent/api/routes.py" = ["B904"]
"maitian_agent/tools/asr.py" = ["B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: 需要真实模型/API Key 的集成测试；默认用 -m 'not live' 跳过",
]
addopts = "-m 'not live'"
