x-app: &app
  image: wheatfield:p1-5
  build:
    context: .
    args:
      UV_EXTRAS: ${UV_EXTRAS:-}
  env_file:
    - path: .env
      required: false
  environment: &environment
    LLM_BASE_URL: ${LLM_BASE_URL:-}
    LLM_MODEL: ${LLM_MODEL:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
    LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
    LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
    EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-local}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
    EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    ASR_API_KEY: ${ASR_API_KEY:-}
    ASR_BASE_URL: ${ASR_BASE_URL:-}
    ASR_MODEL: ${ASR_MODEL:-}
    OCR_BACKEND: ${OCR_BACKEND:-none}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501,http://localhost:5173,http://127.0.0.1:5173}
    MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
    UPLOAD_DIR: /app/data/uploads
  volumes:
    - ./data:/app/data

services:
  # Bind mounts hide image ownership; initialize even a fresh Docker-created data/.
  data-init:
    image: wheatfield:p1-5
    build:
      context: .
      args:
        UV_EXTRAS: ${UV_EXTRAS:-}
    user: "0:0"
    volumes:
      - ./data:/app/data
    command: ["sh", "-c", "mkdir -p /app/data/uploads /app/data/chroma /app/data/memory /app/data/assets && chown -R 1000:1000 /app/data"]
    healthcheck:
      disable: true

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      data-init:
        condition: service_completed_successfully

  streamlit:
    <<: *app
    command: ["streamlit", "run", "maitian_agent/frontend/streamlit_app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    ports:
      - "8501:8501"
    environment:
      <<: *environment
      MAITIAN_API_BASE: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)"]
